services:
  postgres:
    image: postgres:16-alpine
    container_name: optima-postgres
    environment:
      POSTGRES_DB: optima
      POSTGRES_USER: optima
      POSTGRES_PASSWORD: optima123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optima -d optima"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
